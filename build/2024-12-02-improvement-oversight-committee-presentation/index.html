<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Jeff</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      line-height: 1.6;
      color: #000;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .banner-container {
      width: 100%;
      position: relative;
      background-color: #f5f5f5;
    }

    .banner {
      width: 100%;
      height: 200px;
      overflow: hidden;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.15;
    }

    .banner-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
    }

    .header-content {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 2.5rem 1.5rem 2.5rem;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 400;
      color: #333;
    }

    .content-area {
      padding-top: 1rem;
      min-height: 1080px;
    }

    .summary-wrapper {
      padding-top: 1.5rem;
    }

    .summary-section {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
    }

    .summary {
      padding: 1.5rem;
      background-color: #f0f0fa;
      border-radius: 12px;
      box-shadow: 2px 2px 4px rgba(32, 32, 64, 0.3);
    }

    .summary ul {
      padding-left: 1.5rem;
    }

    .summary li {
      margin-bottom: 0.5rem;
    }

    .timeline {
      position: relative;
    }

    .month-section {
      position: relative;
      width: 100%;
    }

    .summary-header,
    .month-year {
      padding: 0.75rem 2.5rem;
      background-color: rgba(255, 255, 255, 0.96);
      font-size: 1.25rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #eee;
      backdrop-filter: blur(1px);
    }

    .timeline-items {
      padding: 1.5rem;
    }

    .link-wrapper {
      text-dectoration: none;
      color: inherit;
    }

    .timeline-item {
      margin-bottom: 1.5rem;
      border-radius: 1rem;
      overflow: hidden;
      position: relative;
      box-shadow: 2px 2px 4px rgba(32, 32, 64, 0.3);
    }

    .timeline-item img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    .timeline-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.75rem 1rem;
      background-color: rgba(242, 242, 242, 0.96);
      font-size: 0.95rem;
    }

    .footer {
      background-color: rgba(242, 242, 242, 1);
      padding: 2rem 0;
      width: 100%;
      margin-top: 2rem;
    }

    .footer-content {
      text-align: right;
      padding: 0 2.5rem;
    }

    @media (max-width: 700px) {
      .title {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .month-year {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .title {
        font-size: 1.5rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      .summary li {
        font-size: 0.9rem;
      }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-07Y50TJ7SD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-07Y50TJ7SD');
  </script>
</head>
<body>
  <div class="banner-container">
    <div class="banner">
      <img src="/banner.jpg" alt="Banner">
    </div>
    <div class="banner-content">
      <div class="header-content">
        <h1 class="title">Modern Jeff</h1>
        <h2 class="subtitle">Just a Demo family trying to keep up with the modernization process.</h2>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="content-area">
      <div class="timeline">
        <div class="timeline-items">
          <ul>
            <li><a href="/2024-12-02-improvement-oversight-committee-presentation/presentation.pdf" target="_blank">2024-12-02-improvement-oversight-committee-presentation/presentation.pdf</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <div class="footer-content">
        <p>modern jeff info (gmail)</p>
      </div>
    </div>
  </div>
</body>
</html>
